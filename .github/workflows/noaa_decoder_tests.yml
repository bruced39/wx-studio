name: NOAA decoder core tests
on:
  push:
    branches:
      - main
      - feat/noaa-native-decoder-workers-v0-9-73
    paths:
      - 'studio/weather/ingest/**'
      - 'tests/test_noaa_ingest.py'
      - '.github/workflows/noaa_decoder_tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy pillow
      - run: python -m unittest discover -s tests -p test_noaa_ingest.py -v
