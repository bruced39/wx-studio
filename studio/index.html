<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WX Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b121c;--p1:#121c2a;--p2:#182536;--line:#26384f;--tx:#e6eef8;--mut:#8aa3c0;--acc:#2f9bff;--acc2:#1c6fc2;--bad:#ff5a5a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.35 Barlow,"Segoe UI",Arial,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--p2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}button.pri{background:var(--acc);border-color:var(--acc);color:#04101e;font-weight:700}button.pri:hover{background:#5ab3ff}
button.on{background:var(--acc2);border-color:var(--acc)}button.sm{padding:2px 7px;font-size:12px}button.dng:hover{border-color:var(--bad);color:var(--bad)}
input[type=text],input[type=number],input[type=email],input[type=password],select,textarea{background:#0d1623;color:#f5f8ff;caret-color:#f5f8ff;border:1px solid var(--line);border-radius:5px;padding:4px 6px;width:100%;color-scheme:dark}
input[type=email]::placeholder,input[type=password]::placeholder{color:#a9b6cb;opacity:1}
input[type=email]:-webkit-autofill,input[type=password]:-webkit-autofill{
  -webkit-text-fill-color:#f5f8ff;box-shadow:0 0 0 1000px #0d1623 inset;caret-color:#f5f8ff}
input[type=color]{width:42px;height:26px;padding:0;border:1px solid var(--line);background:none}input[type=range]{width:100%}
#app{display:grid;grid-template-rows:44px 1fr;height:100vh}
#top{display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--p1);border-bottom:1px solid var(--line)}
#top .brand{font:800 20px "Barlow Condensed",sans-serif;letter-spacing:.5px}#top .brand b{color:var(--acc)}
#showName{width:230px}#top .sp{flex:1}
#main{display:grid;grid-template-columns:212px 1fr 318px;min-height:0}
#scenes{background:var(--p1);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#sceneList{overflow:auto;padding:8px;flex:1}
.sc{border:2px solid transparent;border-radius:8px;background:var(--p2);padding:5px;margin-bottom:8px;cursor:pointer;position:relative}
.sc.on{border-color:var(--acc)}.sc canvas{width:100%;display:block;border-radius:4px;background:#000;aspect-ratio:16/9}
.sc .nm{display:flex;justify-content:space-between;margin-top:4px;font-weight:600}.sc .meta{color:var(--mut);font-size:12px}
.sc .acts{position:absolute;top:8px;right:8px;display:none;gap:3px}.sc:hover .acts{display:flex}
#sceneBtns{padding:8px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
#center{display:flex;flex-direction:column;min-width:0;min-height:0;padding:8px;gap:6px}
#stageBox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#05090f;border-radius:8px}
#stageWrap{position:relative;aspect-ratio:16/9;max-width:100%;max-height:100%;height:100%}
#stageWrap canvas{position:absolute;inset:0;width:100%;height:100%}
#mapZoomBadge{position:absolute;right:1.25%;top:2.037%;width:8.02%;height:4.074%;pointer-events:none;z-index:2}
#mapZoomBadge[hidden]{display:none}
#mapZoomBadge svg{width:100%;height:100%;display:block;overflow:visible}
#stageWrap.present{position:fixed;inset:0;z-index:50;background:#000;height:auto;max-height:none;aspect-ratio:auto}
#stageWrap.present canvas{object-fit:contain}
#tools{display:flex;gap:4px;flex-wrap:wrap;align-items:center}#tools .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
#tools select{width:auto}
#transport{display:flex;gap:6px;align-items:center}#scrub{flex:1}#tc{width:96px;text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
#side{background:var(--p1);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;border-bottom:1px solid var(--line)}#tabs button{flex:1;border:0;border-radius:0;background:none;padding:8px 2px;font-size:12px;white-space:nowrap;border-bottom:2px solid transparent}
#tabs button.on{border-bottom-color:var(--acc);color:#fff;background:var(--p2)}
#panels{overflow:auto;flex:1;padding:10px}
.row{display:grid;grid-template-columns:96px 1fr;gap:6px;align-items:center;margin-bottom:7px}.row label{color:var(--mut)}
.row.full{grid-template-columns:1fr}.h{font:700 12px Barlow,sans-serif;letter-spacing:.8px;text-transform:uppercase;color:var(--acc);margin:14px 0 6px;border-bottom:1px solid var(--line);padding-bottom:3px}
.h:first-child{margin-top:0}
.mapacc{margin:7px 0;border:1px solid var(--line);border-radius:7px;background:#0d1623;overflow:hidden}
.mapacc>summary{list-style:auto;cursor:pointer;padding:7px 9px;font:700 12px Barlow,sans-serif;letter-spacing:.7px;text-transform:uppercase;color:var(--acc);background:var(--p2);user-select:none}
.mapacc>summary:hover{background:#1b2c40;color:#fff}
.mapacc[open]>summary{border-bottom:1px solid var(--line)}
.mapaccbody{padding:9px 9px 3px}.mapaccbody>.row:last-child{margin-bottom:5px}
.hint{color:var(--mut);font-size:12px;margin:4px 0 8px}
.igrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.ic{background:linear-gradient(#183a63,#0c1d36);border:1px solid var(--line);border-radius:8px;padding:2px;cursor:pointer;text-align:center;font-size:10.5px;color:var(--mut)}
.ic canvas{width:100%;display:block}.ic:hover,.ic.on{border-color:var(--acc);color:#fff}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.as{background:var(--p2);border:1px solid var(--line);border-radius:6px;padding:4px}.as img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-radius:3px}.as div{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
#drop{border:2px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--mut);margin-bottom:10px}#drop.hov{border-color:var(--acc);color:#fff}
/* Aguacero-inspired map style flyout; independent scroll, editor stays usable. */
#bMapStyle{padding:5px 9px;display:inline-flex;align-items:center;justify-content:center;gap:5px}
#bMapStyle svg{display:block}
#bMapStyle.active{background:#1452b6;border-color:#397cff;color:#fff}
#mapStyleFlyout{position:fixed;z-index:80;top:51px;left:8px;bottom:10px;width:min(394px,calc(100vw - 16px));display:none;flex-direction:column;background:#17191c;border:1px solid #33373e;border-radius:9px;box-shadow:0 12px 35px rgba(0,0,0,.65);color:#eceef4;overflow:hidden}
#mapStyleFlyout.open{display:flex}
#mapStyleFlyout{font: 13.5px/1.43 "Segoe UI",Arial,sans-serif;letter-spacing:0; -webkit-font-smoothing:auto; text-rendering:optimizeLegibility}
#mapStyleFlyout button,#mapStyleFlyout input,#mapStyleFlyout select{font-family:"Segoe UI",Arial,sans-serif;font-size:13px}
#mapStyleFlyout #mapStyleScroll .mapacc>summary{font-family:"Segoe UI",Arial,sans-serif;font-size:13.5px;letter-spacing:0;font-weight:650}
#mapStyleFlyout #mapStyleScroll .mapaccbody label{font-size:13px;font-weight:500}
#mapStyleFlyout #mapStyleScroll .hint{font-size:12.5px;line-height:1.45}
#mapStyleFlyout #mapStyleScroll .mapstyle-card .caption{font-size:12.5px}
#mapStyleFlyout #mapStyleHead strong{font-size:16px;letter-spacing:0;font-weight:700}
#mapStyleFlyout #mapStyleTabs button{font-size:13px;font-weight:600}
#mapStyleFlyout .row{grid-template-columns:142px minmax(0,1fr)}
#mapStyleHead{height:51px;min-height:51px;display:flex;align-items:center;padding:0 10px;gap:8px;border-bottom:1px solid #33383f}
#mapStyleHead strong{font-weight:800;font-size:17px;flex:1}
#mapStyleHead button{background:none;border:0;color:inherit}
#mapStyleHead button.pri{background:#1458d4;border:1px solid #2069ef;color:#fff}
#mapStyleClose{font-size:22px!important;padding:2px 9px!important}
#mapStyleTabs{display:flex;min-height:40px;border-bottom:1px solid #3a3e46}
#mapStyleTabs button{width:50%;background:none;border:0;border-radius:0}
#mapStyleTabs button.on{border-bottom:2px solid #2679ed;color:#fff;font-weight:700}
#mapStyleScroll{padding:10px 8px 30px;overflow:auto;overscroll-behavior:contain;min-height:0;flex:1}
#mapStyleScroll .mapacc{background:#181a1d;border-color:#353a41;margin:8px 0}
#mapStyleScroll .mapacc>summary{background:#24262a;color:#f2f3f5;letter-spacing:0;text-transform:none;font-size:12px}
#mapStyleScroll .mapaccbody{padding:10px}
#mapStyleScroll .row{grid-template-columns:142px minmax(0,1fr);gap:8px}
#mapStyleScroll .row label{color:#d9dce2}
#mapStyleScroll input[type=text],#mapStyleScroll input[type=number],#mapStyleScroll select{background:#222429;border-color:#40434d}
#mapStyleScroll input[type=checkbox]{accent-color:#2471ee}
#mapStyleScroll input[type=range]{accent-color:#2471ee}
#mapStyleScroll .hint{color:#a9aeb9}
.mapstyle-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:10px 0}
.mapstyle-card{height:93px;padding:0!important;display:flex;flex-direction:column;overflow:hidden;border-radius:7px!important;background:#222!important}
.mapstyle-card .swatch{height:61px;display:block;width:100%;background:#111;background-position:center;background-size:cover;background-repeat:no-repeat}
.mapstyle-card.active{border:2px solid #2471ee!important}
.mapstyle-card .caption{font-size:12px;text-align:center;padding:5px 0;font-weight:700}
.mapstyle-choices{display:flex;gap:3px;margin:8px 0}
.mapstyle-choices button{flex:1;padding:7px 0;background:#26282c;border:1px solid #343941;border-radius:3px}
.mapstyle-choices button.active{background:#2466df;color:white}
.mapstyle-actions{display:flex;gap:8px;align-items:center;margin:8px 0}
.mapstyle-slider{display:flex;gap:7px;align-items:center;min-width:0}
.mapstyle-slider input[type=range]{flex:1;min-width:0}
.mapstyle-slider-value{flex:0 0 45px;text-align:right;color:#c7cbd6;font-size:11px;font-variant-numeric:tabular-nums}
.mapstyle-actions button{flex:1}
#modalBg{position:fixed;inset:0;background:rgba(2,6,12,.72);display:none;align-items:center;justify-content:center;z-index:100}
#modal{background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:16px;max-width:96vw;max-height:94vh;overflow:auto;min-width:420px}
#modal h3{margin:0 0 10px;font:800 22px "Barlow Condensed",sans-serif}.mb{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
table.t7{border-collapse:collapse}table.t7 td,table.t7 th{padding:3px;text-align:left;font-weight:600;color:var(--mut)}table.t7 input,table.t7 select{padding:3px 4px}
.prog{height:12px;background:#0d1623;border-radius:6px;overflow:hidden;border:1px solid var(--line)}.prog i{display:block;height:100%;width:0;background:var(--acc)}
#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#0d1623;border:1px solid var(--acc);padding:7px 14px;border-radius:8px;display:none;z-index:200}
.t7 td.dis{opacity:.3}.t7 td.dis *{pointer-events:none}
</style></head><body>
<div id="app">
 <div id="top"><span class="brand">WX <b>STUDIO</b></span><span id="ver" title="Build version – if this does not change after an update, the app has not redeployed yet" style="font:600 12px Barlow,sans-serif;color:#7fb2e6;background:#10243d;border:1px solid #234a78;border-radius:10px;padding:2px 9px;margin:0 10px 0 -4px;white-space:nowrap">v__WX_VERSION__</span><input id="showName" type="text" title="Show name">
  <button id="bNew">New</button><button id="bOpen">Open…</button><button id="bSave">Save</button>
  <button id="bUndo" title="Ctrl+Z">↶</button><button id="bRedo" title="Ctrl+Y">↷</button><button id="bMapStyle" title="Map Style settings" aria-label="Open Map Style settings" aria-expanded="false"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 5.7 9.5 3l5.1 2.8L20.5 3v15.3l-5.9 2.7-5.1-2.8-6 2.8z" fill="#dedfe4"/><path d="M9.5 3v15.2l5.1 2.8V5.8z" fill="#9299a2"/><path d="M3.5 5.7 9.5 3v15.2l-6 2.8z" fill="#c9ccd4"/><path d="M14.6 5.8 20.5 3v15.3l-5.9 2.7z" fill="#eceef2"/></svg></button><span class="sp"></span>
  <button id="bPresent">▶ Present</button><button id="bExport" class="pri">Export MP4</button><input id="fileOpen" type="file" accept=".json,.wxshow" hidden></div>
 <div id="main">
  <div id="scenes"><div id="sceneList"></div><div id="sceneBtns"><button id="bAddScene" class="pri">+ Scene</button><button id="b7">7-Day…</button></div></div>
  <div id="center">
   <div id="stageBox"><div id="stageWrap"><canvas id="stage" width="1920" height="1080"></canvas><canvas id="overlay" width="1920" height="1080"></canvas><div id="mapZoomBadge" hidden aria-live="off" aria-label="Current map zoom"><svg viewBox="0 0 154 44" preserveAspectRatio="none" aria-hidden="true"><rect x="1" y="1" width="152" height="42" rx="8" fill="rgba(8,20,38,0.88)" stroke="rgba(100,180,255,0.75)" stroke-width="2"/><text id="mapZoomValue" x="77" y="23" fill="#ffffff" font-size="23" font-weight="700" font-family="Barlow,Arial,sans-serif" text-anchor="middle" dominant-baseline="middle">ZOOM 0.0</text></svg></div></div></div>
   <div id="tools"></div>
   <div id="transport"><button id="bPlayScene">▶ Scene</button><button id="bPlayShow">▶ Show</button><button id="bStop">■</button><input id="scrub" type="range" min="0" max="10" step="0.01" value="0"><span id="tc">0.0 / 0.0 s</span></div>
  </div>
  <div id="side"><div id="tabs"><button data-t="scene" class="on">Scene</button><button data-t="object">Object</button><button data-t="library">Library</button><button data-t="media">Media</button><button data-t="bgs">Assets</button></div><div id="panels"></div></div>
 </div>
</div>
<div id="mapStyleFlyout" role="dialog" aria-label="Map Style" aria-modal="false">
  <div id="mapStyleHead"><strong>Map Style</strong><button id="mapStyleSave" class="pri">Save Style</button><button id="mapStyleClose" title="Close map settings" aria-label="Close Map Style">×</button></div>
  <div id="mapStyleTabs"><button data-mt="customize" class="on">Customize</button><button data-mt="saved">Saved Styles</button></div>
  <div id="mapStyleScroll"></div>
 </div>
<div id="modalBg"><div id="modal"></div></div><div id="toast"></div><input id="fileImg" type="file" accept="image/*" multiple hidden>
<script src="icons.js"></script><script src="icons_hd_art.js"></script><script src="icons_hd.js"></script><script src="symbols.js"></script><script src="map.js"></script><script src="mapbox.js"></script><script src="cloud_presets.js"></script><script src="bg7day.js"></script><script src="bgdefault.js"></script><script src="engine.js"></script><script src="mp4.js"></script><script src="export.js"></script><script src="ui.js"></script>
</body></html>
